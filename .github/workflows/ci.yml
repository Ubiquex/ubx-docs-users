name: ci

# Added in the same slice as the shared-UI extraction, deliberately.
# ubx-docs-providers ran with no branch protection and eight consecutive
# red runs reached its main unnoticed. This repo gets the gate before it
# accumulates the same history.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Distribution config is within CloudFront's limits
        # The committed Comment shipped at 138 chars against a 128
        # limit, which CloudFront only reports after a real API
        # round trip. 138 chars of prose looks exactly like 128 in
        # review.
        run: node infra/check-distribution-config.mjs
      - name: CloudFront rewrite function tests
        # Plain node, no AWS. Reads infra/cloudfront/rewrite.js
        # itself, so what is tested is the exact bytes that get
        # uploaded rather than a re-typed copy that could drift.
        run: node --test infra/cloudfront/rewrite.test.mjs
      - name: No dead internal links
        # A wrong href renders as an ordinary link and fails only
        # when clicked. Two shipped to main, one of them in the
        # header and so dead on 144 of 147 pages.
        run: npm run check:links
      - name: Confirm the export actually produced pages
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          n="$(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "exported HTML pages: $n"
          [ "$n" -ge 40 ] || { echo "only $n pages exported, expected the Concepts set"; exit 1; }
